<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />

	<meta property="og:type" content="website" />
	<meta property="og:url" content="https://geniushydra.com/gallery.html" />
	<meta property="og:image" content="https://geniushydra.com/assets/og-image.png" />

	<link rel="icon" type="image/png" sizes="128x128" href="assets/favicon.png" />
	<link rel="icon" href="assets/favicon.ico" />
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet" />
	<link rel="stylesheet" href="css/style.css" />
</head>
<body>
	<div class="crt-overlay" aria-hidden="true"></div>

	<header class="site-header">
		<nav class="nav">
			<a class="nav-brand" href="/">geniushydra@web:~<span class="cursor">█</span></a>
			<div class="nav-links">
				<a href="/">~/</a>
				<a href="/about.html">~/about</a>
				<a href="/setup.html">~/setup</a>
				<a href="/gallery.html">~/gallery</a>
				<a href="/presence.html">~/presence</a>
			</div>
			<div class="accent-switcher" role="group" aria-label="Цвет фосфора">
				<button type="button" class="accent-dot" data-accent="green" style="background:#33ff33" title="Зелёный" aria-label="Зелёный фосфор"></button>
				<button type="button" class="accent-dot" data-accent="amber" style="background:#ffb000" title="Янтарный" aria-label="Янтарный фосфор"></button>
				<button type="button" class="accent-dot" data-accent="cyan" style="background:#00e5ff" title="Голубой" aria-label="Голубой фосфор"></button>
				<button type="button" class="accent-dot" data-accent="red" style="background:#ff5555" title="Красный" aria-label="Красный фосфор"></button>
				<button type="button" class="accent-dot" data-accent="paper" style="background:#e6e6e6" title="Белый" aria-label="Белый фосфор"></button>
			</div>
		</nav>
	</header>

	<main class="terminal reveal">
		<div class="terminal-bar">
			<span class="t-dot t-red"></span>
			<span class="t-dot t-yellow"></span>
			<span class="t-dot t-green"></span>
			<span class="terminal-title">geniushydra@web: ~/gallery</span>
		</div>

		<div class="terminal-body">
			<p class="prompt-line"><span class="prompt">$</span> ls ~/gallery/</p>
			<h1>Галерея</h1>
			<p class="lead">Клипы, скриншоты и моменты.</p>

			<!--
				Чтобы добавить изображения: положи их в assets/gallery/ с именами 1.jpg, 2.jpg, 3.jpg …
				(или отредактируй src ниже). Плитки с отсутствующими изображениями скрываются автоматически.
			-->
			<div class="gallery" style="margin-top:1.5rem">
				<div class="gallery-item img-box"><img src="assets/gallery/1.jpg" alt="" loading="lazy" /></div>
				<div class="gallery-item img-box"><img src="assets/gallery/2.jpg" alt="" loading="lazy" /></div>
				<div class="gallery-item img-box"><img src="assets/gallery/3.jpg" alt="" loading="lazy" /></div>
				<div class="gallery-item img-box"><img src="assets/gallery/4.jpg" alt="" loading="lazy" /></div>
				<div class="gallery-item img-box"><img src="assets/gallery/5.jpg" alt="" loading="lazy" /></div>
				<div class="gallery-item img-box"><img src="assets/gallery/6.jpg" alt="" loading="lazy" /></div>
			</div>
		</div>
	</main>

	<footer class="site-footer">
		<p>© <span id="year">2025</span> GeniusHydra — все системы работают</p>
	</footer>

	<script src="config.js"></script>
	<script src="js/main.js"></script>
	<script src="js/gallery.js"></script>
</body>
</html>
