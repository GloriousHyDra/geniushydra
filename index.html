	<meta charset="UTF-8" />

	<meta property="og:description" content="GeniusHydra — Discord, Telegram, Steam и не только." />
	<meta property="og:type" content="website" />
	<meta property="og:url" content="https://geniushydra.com/" />
	<meta property="og:image" content="https://geniushydra.com/assets/og-image.png" />
	<meta property="og:image:width" content="1200" />
	<meta property="og:image:height" content="630" />
	<meta property="og:locale" content="ru_RU" />
	<meta name="twitter:card" content="summary_large_image" />
	<meta name="twitter:image" content="https://geniushydra.com/assets/og-image.png" />

	<link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
	<link rel="icon" href="assets/favicon.ico" />

	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet" />
	<link rel="stylesheet" href="css/style.css" />

	<!-- Аналитика (GoatCounter): зарегистрируйся на goatcounter.com, затем раскомментируй и вставь свой код:

</head>
<body>
	<div class="crt-overlay" aria-hidden="true"></div>

	<header class="site-header">
		<nav class="nav">
			<a class="nav-brand" href="/">geniushydra@web:~<span class="cursor">█</span></a>
			<div class="nav-links">
				<a href="/">~/</a>
				<a href="/about.html">~/about</a>
				<a href="/setup.html">~/setup</a>
				<a href="/gallery.html">~/gallery</a>
				<a href="/presence.html">~/presence</a>
			</div>
			<div class="accent-switcher" role="group" aria-label="Цвет фосфора">
				<button type="button" class="accent-dot" data-accent="green" style="background:#33ff33" title="Зелёный" aria-label="Зелёный фосфор"></button>
				<button type="button" class="accent-dot" data-accent="amber" style="background:#ffb000" title="Янтарный" aria-label="Янтарный фосфор"></button>
				<button type="button" class="accent-dot" data-accent="cyan" style="background:#00e5ff" title="Голубой" aria-label="Голубой фосфор"></button>
				<button type="button" class="accent-dot" data-accent="red" style="background:#ff5555" title="Красный" aria-label="Красный фосфор"></button>
				<button type="button" class="accent-dot" data-accent="paper" style="background:#e6e6e6" title="Белый" aria-label="Белый фосфор"></button>
			</div>
		</nav>
	</header>

	<main class="terminal terminal-home reveal">
		<div class="terminal-bar">
			<span class="t-dot t-red"></span>
			<span class="t-dot t-yellow"></span>
			<span class="t-dot t-green"></span>
			<span class="terminal-title">geniushydra@web: ~</span>
		</div>

		<div class="terminal-body">
			<div class="avatar img-box">
				<img src="assets/icons/avatar.png" alt="GeniusHydra" />
				<span class="img-fallback avatar-fallback">G</span>
			</div>

			<p class="prompt-line"><span class="prompt">$</span> whoami</p>
			<h1>GeniusHydra<span class="cursor">█</span></h1>

			<p class="prompt-line"><span class="prompt">$</span> status</p>
			<span class="status-pill" data-discord-status data-discord-optional hidden></span>
			<div class="activities" data-discord-activities hidden></div>

			<p class="prompt-line"><span class="prompt">$</span> copy --username</p>
			<div class="copy-row">
				<button type="button" class="copy-btn" data-copy-key="discord">[discord]</button>
				<button type="button" class="copy-btn" data-copy-key="telegram">[telegram]</button>
				<button type="button" class="copy-btn" data-copy-key="steam">[steam]</button>
			</div>

			<p class="prompt-line"><span class="prompt">$</span> ls ./links</p>
			<nav class="links" id="links" aria-label="Социальные ссылки"></nav>

			<p class="prompt-line"><span class="prompt">$</span> <span class="cursor">█</span></p>
		</div>
	</main>

	<footer class="site-footer">
		<p>© <span id="year">2025</span> GeniusHydra — все системы работают</p>
	</footer>

	<script src="config.js"></script>
	<script src="js/main.js"></script>
	<script src="js/links.js"></script>
	<script src="js/presence.js"></script>
</body>
</html>
